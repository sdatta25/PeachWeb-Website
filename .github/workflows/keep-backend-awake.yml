# Render's free tier puts the backend to sleep after about 15 minutes without traffic,
# and the first request afterwards takes 20 to 30 seconds. This pings it every 10 minutes
# so a visitor's form submission or chat message never hits a cold start.
#
# GitHub runs scheduled jobs on a best-effort basis, so an occasional ping can arrive late.
# The site also wakes the backend as soon as a page loads (warmBackend in frontend/src/lib/api.js).
# GitHub pauses scheduled workflows after 60 days without repository activity; pushing a
# commit, or enabling the workflow again in the Actions tab, restarts it.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: |
          code=$(curl -sS -o /dev/null -m 90 -w '%{http_code}' https://peachweb-backend.onrender.com/ || echo 000)
          echo "Backend answered HTTP $code"
          # The root path has no page, so a 404 is a healthy reply. Only fail on no answer or a server error.
          case "$code" in 000|5*) exit 1 ;; esac
