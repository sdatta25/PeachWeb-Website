<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PeachWeb — Responsive Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; font-family: system-ui, sans-serif; min-height: 100vh; }

    /* Header */
    header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 17px; font-weight: 700; color: #FF8C61; }
    header p  { font-size: 12px; color: #6B7280; margin-top: 2px; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; background: #222; padding: 4px; border-radius: 10px; }
    .tab {
      padding: 7px 15px; border-radius: 7px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.15s;
      color: #9CA3AF; background: transparent;
    }
    .tab.active { background: #FF8C61; color: white; }
    .tab:hover:not(.active) { color: white; }

    /* Page sections */
    .view { display: none; padding: 36px 24px 48px; }
    .view.active { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    #view-all.active { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; }

    .device-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .device-label {
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: #6B7280;
    }
    .size-badge {
      font-size: 12px; color: #9CA3AF; font-family: monospace;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      padding: 4px 10px; border-radius: 6px;
    }
    .size-badge b { color: #FF8C61; }

    /* ─── PHONE frame ───
       Device: 375 × 812
       Display: 260 × 520  →  scale = 260/375 = 0.6933
       iframe height = 520 / 0.6933 ≈ 750
    */
    .phone-outer {
      background: #1c1c1c;
      border-radius: 48px;
      padding: 14px 10px;
      box-shadow: 0 0 0 2px #333, 0 0 0 4px #222, 0 28px 56px rgba(0,0,0,.7);
      position: relative;
    }
    .phone-outer::before {          /* notch */
      content: '';
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      width: 72px; height: 6px;
      background: #333; border-radius: 3px;
    }
    .phone-screen {
      width: 260px;
      height: 520px;
      border-radius: 36px;
      overflow: hidden;
      background: white;
    }
    .phone-screen iframe {
      width: 375px;
      height: 750px;
      border: none;
      transform-origin: top left;
      transform: scale(0.6933);
    }

    /* ─── TABLET frame ───
       Device: 768 × 1024
       Display: 460 × 580  →  scale = 460/768 = 0.5990
       iframe height = 580 / 0.5990 ≈ 968
    */
    .tablet-outer {
      background: #1c1c1c;
      border-radius: 26px;
      padding: 18px 12px;
      box-shadow: 0 0 0 2px #333, 0 0 0 4px #222, 0 28px 56px rgba(0,0,0,.7);
      position: relative;
    }
    .tablet-outer::before {         /* home button dot */
      content: '';
      position: absolute;
      top: 50%; left: 7px; transform: translateY(-50%);
      width: 4px; height: 4px; background: #444; border-radius: 50%;
    }
    .tablet-screen {
      width: 460px;
      height: 580px;
      border-radius: 16px;
      overflow: hidden;
      background: white;
    }
    .tablet-screen iframe {
      width: 768px;
      height: 968px;
      border: none;
      transform-origin: top left;
      transform: scale(0.5990);
    }

    /* ─── DESKTOP frame ───
       Device: 1280 × 800
       Display: 860 × 520  →  scale = 860/1280 = 0.6719
       iframe height = 520 / 0.6719 ≈ 774
    */
    .desktop-outer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .desktop-lid {
      background: #222;
      border-radius: 12px 12px 0 0;
      padding: 28px 8px 0;
      box-shadow: 0 0 0 1px #333;
      position: relative;
    }
    .desktop-lid::before {          /* menu bar dot row */
      content: '';
      position: absolute;
      top: 10px; left: 50%; transform: translateX(-50%);
      width: 50px; height: 5px; background: #333; border-radius: 3px;
    }
    .desktop-dots {
      position: absolute; top: 9px; left: 12px;
      display: flex; gap: 5px;
    }
    .desktop-dots span {
      width: 8px; height: 8px; border-radius: 50%; display: block;
    }
    .desktop-screen {
      width: 860px;
      height: 520px;
      overflow: hidden;
      background: white;
    }
    .desktop-screen iframe {
      width: 1280px;
      height: 774px;
      border: none;
      transform-origin: top left;
      transform: scale(0.6719);
    }
    .desktop-stand {
      width: 120px; height: 14px;
      background: #2a2a2a; border-radius: 0 0 4px 4px;
    }
    .desktop-base {
      width: 240px; height: 7px;
      background: #222; border-radius: 4px; margin-top: 1px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🍑 PeachWeb</h1>
    <p>Responsive Device Preview — localhost:5174</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="show('all',this)">All Devices</button>
    <button class="tab"        onclick="show('mobile',this)">📱 Mobile</button>
    <button class="tab"        onclick="show('tablet',this)">📟 Tablet</button>
    <button class="tab"        onclick="show('desktop',this)">🖥️ Desktop</button>
  </div>
</header>

<!-- ── ALL DEVICES ── -->
<div id="view-all" class="view active">

  <div class="device-wrap">
    <p class="device-label">📱 iPhone — 375px</p>
    <div class="phone-outer">
      <div class="phone-screen">
        <iframe src="http://localhost:5174" title="Mobile"></iframe>
      </div>
    </div>
    <p class="size-badge"><b>375</b> × 812 px</p>
  </div>

  <div class="device-wrap">
    <p class="device-label">📟 iPad — 768px</p>
    <div class="tablet-outer">
      <div class="tablet-screen">
        <iframe src="http://localhost:5174" title="Tablet"></iframe>
      </div>
    </div>
    <p class="size-badge"><b>768</b> × 1024 px</p>
  </div>

  <div class="device-wrap">
    <p class="device-label">🖥️ Desktop — 1280px</p>
    <div class="desktop-outer">
      <div class="desktop-lid">
        <div class="desktop-dots">
          <span style="background:#ff5f57"></span>
          <span style="background:#febc2e"></span>
          <span style="background:#28c840"></span>
        </div>
        <div class="desktop-screen">
          <iframe src="http://localhost:5174" title="Desktop"></iframe>
        </div>
      </div>
      <div class="desktop-stand"></div>
      <div class="desktop-base"></div>
    </div>
    <p class="size-badge"><b>1280</b> × 800 px</p>
  </div>

</div>

<!-- ── MOBILE ── -->
<div id="view-mobile" class="view">
  <p class="device-label">📱 iPhone — 375 × 812 px</p>
  <div class="phone-outer">
    <div class="phone-screen">
      <iframe src="http://localhost:5174" title="Mobile"></iframe>
    </div>
  </div>
  <p class="size-badge"><b>375</b> × 812 px</p>
</div>

<!-- ── TABLET ── -->
<div id="view-tablet" class="view">
  <p class="device-label">📟 iPad — 768 × 1024 px</p>
  <div class="tablet-outer">
    <div class="tablet-screen">
      <iframe src="http://localhost:5174" title="Tablet"></iframe>
    </div>
  </div>
  <p class="size-badge"><b>768</b> × 1024 px</p>
</div>

<!-- ── DESKTOP ── -->
<div id="view-desktop" class="view">
  <p class="device-label">🖥️ Desktop — 1280 × 800 px</p>
  <div class="desktop-outer">
    <div class="desktop-lid">
      <div class="desktop-dots">
        <span style="background:#ff5f57"></span>
        <span style="background:#febc2e"></span>
        <span style="background:#28c840"></span>
      </div>
      <div class="desktop-screen">
        <iframe src="http://localhost:5174" title="Desktop"></iframe>
      </div>
    </div>
    <div class="desktop-stand"></div>
    <div class="desktop-base"></div>
  </div>
  <p class="size-badge"><b>1280</b> × 800 px</p>
</div>

<script>
  function show(view, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
    btn.classList.add('active')
    document.getElementById('view-' + view).classList.add('active')
  }
</script>
</body>
</html>
